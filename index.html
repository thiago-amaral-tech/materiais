<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Materiais</title>
  <style>
    :root {
      --bg-color: #0f2228;
      --card-bg: #132a30;
      --item-bg: #193339;
      --purple-neon: #8000ff;
      --green-neon: #00ff66;
      --text-color: #00ff66;
      --white: #ffffff;
      --danger: #ff4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    header {
      background-color: var(--card-bg);
      border: 2px solid var(--purple-neon);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 0 10px rgba(128, 0, 255, 0.3);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .search-box {
      width: 100%;
      padding: 10px;
      background: var(--bg-color);
      border: 1px solid var(--purple-neon);
      color: var(--green-neon);
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    .search-box::placeholder {
      color: #00ff6688;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 2px solid var(--purple-neon);
      padding: 10px 15px;
      border-radius: 8px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .counter-info {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .btn {
      background: var(--item-bg);
      color: var(--green-neon);
      border: 1px solid var(--purple-neon);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--purple-neon);
      color: var(--white);
      box-shadow: 0 0 8px var(--purple-neon);
    }

    .btn-copy {
      background: var(--purple-neon);
      color: var(--white);
    }

    .btn-copy:hover {
      background: #9933ff;
    }

    .table-container {
      background-color: var(--card-bg);
      border: 2px solid var(--purple-neon);
      border-radius: 8px;
      padding: 10px;
      max-height: 65vh;
      overflow-y: auto;
    }

    .list-header {
      display: grid;
      grid-template-columns: 100px 1fr 100px;
      gap: 10px;
      padding: 10px 15px;
      font-weight: bold;
      border-bottom: 2px solid var(--purple-neon);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .material-item {
      display: grid;
      grid-template-columns: 100px 1fr 100px;
      gap: 10px;
      align-items: center;
      background-color: var(--item-bg);
      border: 1px solid var(--purple-neon);
      border-radius: 6px;
      padding: 8px 15px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .material-item:hover {
      border-color: var(--green-neon);
    }

    .material-item.selected {
      background-color: #2b124c;
      border: 2px solid var(--green-neon);
      box-shadow: inset 0 0 5px var(--green-neon);
    }

    .code {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .name {
      font-size: 0.85rem;
      color: var(--white);
      word-break: break-word;
    }

    .qty-control {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .btn-qty {
      width: 26px;
      height: 26px;
      background: var(--bg-color);
      color: var(--green-neon);
      border: 1px solid var(--purple-neon);
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-qty:hover {
      background: var(--purple-neon);
      color: var(--white);
    }

    .qty-input {
      width: 38px;
      height: 26px;
      background: var(--bg-color);
      border: 1px solid var(--purple-neon);
      color: var(--green-neon);
      text-align: center;
      border-radius: 4px;
      font-weight: bold;
      outline: none;
    }

    /* Modal Pop-up */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 2px solid var(--purple-neon);
      border-radius: 8px;
      width: 90%;
      max-width: 450px;
      padding: 20px;
      box-shadow: 0 0 20px var(--purple-neon);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-title {
      font-size: 1.1rem;
      text-align: center;
    }

    .modal-content {
      background: var(--bg-color);
      border: 1px solid var(--purple-neon);
      padding: 12px;
      max-height: 250px;
      overflow-y: auto;
      font-size: 0.95rem;
      white-space: pre-wrap;
      color: var(--white);
      border-radius: 4px;
      font-family: 'Courier New', Courier, monospace;
    }

    .modal-actions {
      display: flex;
      justify-content: space-around;
      gap: 15px;
    }

    .btn-modal {
      flex: 1;
      padding: 10px;
      font-size: 0.95rem;
    }

    .btn-no {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-no:hover {
      background: var(--danger);
      color: var(--white);
      box-shadow: 0 0 8px var(--danger);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>LISTA DE MATERIAIS</h1>
      <input type="text" id="searchInput" class="search-box" placeholder="Pesquisar por Código ou Nome...">
    </header>

    <div class="actions-bar">
      <div class="counter-info">
        Selecionados: <span id="selectedCount">0</span>
      </div>
      <div>
        <button id="btnClear" class="btn">Limpar Seleção</button>
        <button id="btnCopyTrigger" class="btn btn-copy">Copiar Seleção</button>
      </div>
    </div>

    <div class="table-container">
      <div class="list-header">
        <div>Código</div>
        <div>Descrição</div>
        <div style="text-align: right;">QTD</div>
      </div>
      <div id="materialsList"></div>
    </div>
  </div>

  <!-- Modal de Confirmação -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-title">Deseja copiar os itens selecionados?</div>
      <div id="modalPreview" class="modal-content"></div>
      <div class="modal-actions">
        <button id="btnConfirmCopy" class="btn btn-modal btn-copy">SIM (Copiar)</button>
        <button id="btnCancelCopy" class="btn btn-modal btn-no">NÃO</button>
      </div>
    </div>
  </div>

    const materials = rawData.map(([code, name], index) => ({
      id: index,
      code,
      name,
      quantity: 1,
      selected: false
    }));

    const materialsList = document.getElementById('materialsList');
    const searchInput = document.getElementById('searchInput');
    const selectedCountEl = document.getElementById('selectedCount');
    const btnClear = document.getElementById('btnClear');
    const btnCopyTrigger = document.getElementById('btnCopyTrigger');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalPreview = document.getElementById('modalPreview');
    const btnConfirmCopy = document.getElementById('btnConfirmCopy');
    const btnCancelCopy = document.getElementById('btnCancelCopy');

    function renderList() {
      const query = searchInput.value.toLowerCase().trim();
      materialsList.innerHTML = '';

      materials.forEach(item => {
        if (query && !item.code.toLowerCase().includes(query) && !item.name.toLowerCase().includes(query)) {
          return;
        }

        const el = document.createElement('div');
        el.className = `material-item ${item.selected ? 'selected' : ''}`;
        el.dataset.id = item.id;

        el.innerHTML = `
          <div class="code">${item.code}</div>
          <div class="name">${item.name}</div>
          <div class="qty-control" onclick="event.stopPropagation();">
            <button class="btn-qty btn-minus" data-id="${item.id}">-</button>
            <input type="number" class="qty-input" data-id="${item.id}" value="${item.quantity}" min="1">
            <button class="btn-qty btn-plus" data-id="${item.id}">+</button>
          </div>
        `;

        // Eventos de Clique / Seleção
        let pressTimer = null;

        const startPress = () => {
          pressTimer = setTimeout(() => {
            toggleSelect(item.id);
            pressTimer = null;
          }, 900);
        };

        const cancelPress = () => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        };

        el.addEventListener('mousedown', startPress);
        el.addEventListener('mouseup', cancelPress);
        el.addEventListener('mouseleave', cancelPress);
        el.addEventListener('touchstart', startPress, { passive: true });
        el.addEventListener('touchend', cancelPress);

        el.addEventListener('click', () => {
          if (!pressTimer) {
            toggleSelect(item.id);
          }
        });

        materialsList.appendChild(el);
      });

      // Event Listeners dos botões de quantidade
      document.querySelectorAll('.btn-minus').forEach(b => {
        b.addEventListener('click', (e) => {
          const id = e.target.dataset.id;
          if (materials[id].quantity > 1) {
            materials[id].quantity--;
            renderList();
          }
        });
      });

      document.querySelectorAll('.btn-plus').forEach(b => {
        b.addEventListener('click', (e) => {
          const id = e.target.dataset.id;
          materials[id].quantity++;
          renderList();
        });
      });

      document.querySelectorAll('.qty-input').forEach(inp => {
        inp.addEventListener('change', (e) => {
          const id = e.target.dataset.id;
          const val = parseInt(e.target.value) || 1;
          materials[id].quantity = val < 1 ? 1 : val;
          renderList();
        });
      });

      updateCounter();
    }

    function toggleSelect(id) {
      materials[id].selected = !materials[id].selected;
      renderList();
    }

    function updateCounter() {
      const count = materials.filter(i => i.selected).length;
      selectedCountEl.textContent = count;
    }

    btnClear.addEventListener('click', () => {
      materials.forEach(i => i.selected = false);
      renderList();
    });

    // Formata o texto APENAS com Código e QTD para ser copiado
    function getFormattedSelection() {
      const selected = materials.filter(i => i.selected);
      if (selected.length === 0) return '';
      return selected.map(i => `${i.code}\tQTD ${i.quantity}`).join('\n');
    }

    btnCopyTrigger.addEventListener('click', () => {
      const text = getFormattedSelection();
      if (!text) {
        alert('Nenhum item selecionado!');
        return;
      }
      modalPreview.textContent = text;
      modalOverlay.classList.add('active');
    });

    btnCancelCopy.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    btnConfirmCopy.addEventListener('click', () => {
      const text = getFormattedSelection();
      navigator.clipboard.writeText(text).then(() => {
        alert('Copiado para a área de transferência com sucesso!');
        modalOverlay.classList.remove('active');
      }).catch(err => {
        alert('Erro ao copiar. Verifique as permissões do seu navegador.');
      });
    });

    searchInput.addEventListener('input', renderList);

    // Inicialização
    renderList();
  </script>
